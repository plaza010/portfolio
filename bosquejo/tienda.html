<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bosquejo Fest - Tienda</title>
  <meta name="description" content="Compra tus entradas para el Bosquejo Fest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #899C75;
      --rojo: #D94726;
      --azul: #B2CFDE;
      --corteza: #60281B;
      --crema: #FFF9E5;
      --arena: #EBDFCC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      color: var(--corteza);
      background: var(--corteza);
    }

    /* Fondo fotográfico desenfocado fijo */
    .bg {
      position: fixed; inset: -4%;
      background: url('assets/bosquejo-bg.jpg') center/cover no-repeat;
      filter: blur(14px) saturate(.9);
      z-index: 0;
    }

    /* Menú superior fijo */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem;
      padding-top: calc(.5rem + env(safe-area-inset-top, 0px));
      background: var(--arena);
    }
    .nav img { height: 1.7rem; display: block; }
    .nav ul { list-style: none; display: flex; gap: .2rem; align-items: center; }
    .nav li + li::before { content: "/"; color: var(--corteza); opacity: .7; margin-right: .2rem; font-style: italic; }
    .nav a {
      font-style: italic; font-weight: 300; font-size: 1.3rem;
      color: var(--corteza); opacity: .38; text-decoration: none;
      padding: .2rem .5rem; transition: opacity .25s;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { opacity: 1; }
    .nav a:focus-visible { outline: 1px solid var(--rojo); outline-offset: 2px; }

    /* Sombra de hojas: GIF animado fijo en primer plano */
    .hojas {
      position: fixed; inset: 0; z-index: 30;
      pointer-events: none;
      background: url('assets/hojas.gif') center/cover no-repeat;
      mix-blend-mode: multiply;
      opacity: .6;
    }

    /* Tarjeta central fija en pantalla */
    main {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 5.5rem 9% 6%;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      background: var(--arena);
      border-radius: .6rem;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden;
      animation: entra 1.6s ease both;
    }

    @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Logo superior izquierdo dentro de la tarjeta */
    .card-brand {
      position: absolute;
      top: 2.2rem;
      left: 3rem;
      z-index: 10;
      width: 140px;
      height: auto;
      display: block;
      opacity: 0.90;
    }

    /* Área con scroll interno dentro de la tarjeta crema */
    .card-scroll-area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 5;
      padding: 7rem 4rem 4rem 4rem;

      scrollbar-width: thin;
      scrollbar-color: #C5B59D transparent;
    }

    .card-scroll-area::-webkit-scrollbar {
      width: 8px;
    }

    .card-scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .card-scroll-area::-webkit-scrollbar-thumb {
      background: #C5B59D;
      border-radius: 10px;
    }

    .card-scroll-area::-webkit-scrollbar-thumb:hover {
      background: #b09e86;
    }

    /* Contenedor de la tienda (Grid para los productos) */
    .store-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 5vw;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .product-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 360px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform .35s cubic-bezier(.25,1,.5,1);
    }

    .product-card-bg {
      background: #FFFFFF;
      padding: 1.5rem 1.5rem 2rem 1.5rem;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      transition: box-shadow .35s cubic-bezier(.25,1,.5,1), transform .35s cubic-bezier(.25,1,.5,1);
    }

    .product-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    /* EFECTO HOVER: Elevación, leve aumento de tamaño y sombra suave */
    .product-item:hover {
      transform: translateY(-8px) scale(1.02);
    }

    .product-item:hover .product-card-bg {
      box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    }

    .product-item:hover img {
      transform: scale(1.04);
    }

    .product-info {
      text-align: center;
      margin-top: 1.2rem;
    }

    .product-title {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      color: var(--corteza);
      text-transform: uppercase;
    }

    .product-price {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      font-size: 1rem;
      color: var(--corteza);
      margin-top: 0.2rem;
    }

    @media (max-width: 900px) {
      .store-container {
        flex-direction: column;
        align-items: center;
        gap: 3rem;
      }
      .card-scroll-area {
        padding: 6rem 1.5rem 3rem 1.5rem;
      }
      .card-brand {
        top: 1.5rem;
        left: 1.5rem;
        width: 110px;
      }
      .product-item {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 760px) {
      .nav a { font-size: 1rem; padding: .2rem .25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .hojas { display: none; }
      .product-item, .product-card-bg, .product-item img { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" role="presentation"></div>

  <!-- Menú superior con los enlaces conectados -->
  <header class="nav">
    <a href="index.html" aria-label="Bosquejo, inicio" style="opacity:1;padding:0"><img src="assets/bosquejo-b.png" alt="B"></a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="tienda.html" aria-current="page">Tienda</a></li>
        <li><a href="index.html">El festival</a></li>
        <li><a href="nosotros-contacto.html">Nosotros / Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      
      <!-- Logo estático superior izquierdo -->
      <img src="assets/bosquejo-logo-estatico.png" class="card-brand" alt="Bosquejo">

      <!-- Área de scroll interno con los productos -->
      <div class="card-scroll-area">
        <div class="store-container">
          
          <!-- Producto 1: Estudiante -->
          <div class="product-item">
            <div class="product-card-bg">
              <img src="assets/tienda-1.jpg" alt="Entrada Estudiante Bosquejo Fest">
            </div>
            <div class="product-info">
              <div class="product-title">ESTUDIANTE</div>
              <div class="product-price">15€</div>
            </div>
          </div>

          <!-- Producto 2: General -->
          <div class="product-item">
            <div class="product-card-bg">
              <img src="assets/tienda-2.jpg" alt="Entrada General Bosquejo Fest">
            </div>
            <div class="product-info">
              <div class="product-title">GENERAL</div>
              <div class="product-price">25€</div>
            </div>
          </div>

        </div>
      </div>

    </section>
  </main>

  <div class="hojas" aria-hidden="true"></div>
</body>
</html>
