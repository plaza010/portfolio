<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bosquejo Fest</title>
  <meta name="description" content="Antes de existir, todo es bosquejo. Festival de moda que celebra el proceso de crear.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,100;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #899C75;
      --rojo: #D94726;
      --azul: #B2CFDE;
      --corteza: #60281B;
      --crema: #FFF9E5;
      --arena: #EBDFCC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      color: var(--corteza);
      background: var(--corteza);
    }

    .bg {
      position: fixed; inset: -4%;
      background: url('assets/bosquejo-bg.jpg') center/cover no-repeat;
      filter: blur(14px) saturate(.9);
      z-index: 0;
    }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem;
      padding-top: calc(.5rem + env(safe-area-inset-top, 0px));
      background: var(--arena);
    }
    .nav img { height: 1.7rem; display: block; }
    .nav ul { list-style: none; display: flex; gap: .2rem; align-items: center; }
    .nav li + li::before { content: "/"; color: var(--corteza); opacity: .7; margin-right: .2rem; font-style: italic; }
    .nav a {
      font-style: italic; font-weight: 300; font-size: 1.3rem;
      color: var(--corteza); opacity: .38; text-decoration: none;
      padding: .2rem .5rem; transition: opacity .25s;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { opacity: 1; }
    .nav a:focus-visible { outline: 1px solid var(--rojo); outline-offset: 2px; }

    .hojas {
      position: fixed; inset: 0; z-index: 30;
      pointer-events: none;
      background: url('assets/hojas.gif') center/cover no-repeat;
      mix-blend-mode: multiply;
      opacity: .6;
    }

    main {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 5.5rem 9% 6%;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      background: var(--arena);
      border-radius: .6rem;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden;
      animation: entra 1.6s ease both;
    }

    .card-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(2rem, 9vh, 6rem);
      pointer-events: none;
      z-index: 2;
    }
    
    .card .logo-animado {
      width: min(44vw, 560px);
      height: auto;
      display: block;
      margin-top: -4vh;
      transform: translateX(-12px);
      opacity: 0.9;
    }

    .lema {
      font-family: 'Roboto', sans-serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(1.1rem, 1.5vw, 1.5rem);
      color: #1a1a1a;
      text-align: center; padding: 0 1.5rem;
    }
    .lema b { font-weight: 400; font-style: italic; color: #000; }
    @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .card-scroll-area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 5;
      padding-bottom: 10rem;
      scrollbar-width: thin;
      scrollbar-color: #EDE0CC transparent;
    }

    .card-scroll-area::-webkit-scrollbar {
      width: 8px;
    }

    .card-scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .card-scroll-area::-webkit-scrollbar-thumb {
      background: #EDE0CC;
      border-radius: 10px;
    }

    .card-scroll-area::-webkit-scrollbar-thumb:hover {
      background: #d8cbba;
    }

    .scroll-inner-content {
      position: relative;
      width: 100%;
      height: 350vh;
      pointer-events: none;
    }

    .photo-container {
      position: absolute;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: transparent;
    }

    .photo-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }

    .photo-caption {
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--corteza);
      margin-top: 0.6rem;
      text-align: left;
      width: 100%;
      opacity: 0.85;
    }

    .box-1 { top: 75vh; left: 4vw; width: 340px; }
    .box-2 { top: 145vh; right: 4vw; width: 360px; }
    .box-3 { top: 220vh; left: 5vw; width: 380px; }
    .box-4 { top: 295vh; right: 5vw; width: 350px; }

    @media (max-width: 760px) {
      .nav a { font-size: 1rem; padding: .2rem .25rem; }
      .nav li + li::before { margin-right: 0; }
      main { padding: 4.5rem 5% 7%; }
      .card .logo-animado { width: 72vw; transform: translateX(-6px); }
      .box-1 { left: 3vw; width: 220px; top: 70vh; }
      .box-2 { right: 3vw; width: 230px; top: 135vh; }
      .box-3 { left: 3vw; width: 240px; top: 205vh; }
      .box-4 { right: 3vw; width: 220px; top: 275vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .hojas { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" role="presentation"></div>

  <header class="nav">
    <a href="./" aria-label="Bosquejo, inicio" style="opacity:1;padding:0"><img src="assets/bosquejo-b.png" alt="B"></a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="#tienda">Tienda</a></li>
        <li><a href="#festival" aria-current="page">El festival</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      
      <div class="card-header">
        <h1 style="all:unset">
          <video class="logo-animado" id="logoVideo" muted playsinline autoplay preload="auto">
            <source src="assets/bosquejo-logo-escribiendo.webm" type="video/webm">
            Tu navegador no soporta video HTML5.
          </video>
        </h1>
        <p class="lema">"Antes de existir, todo es <b>bosquejo.</b>"</p>
      </div>

      <div class="card-scroll-area">
        <div class="scroll-inner-content">
          
          <div class="photo-container box-1">
            <img src="assets/foto-1.jpg" alt="Proceso de diseño 1" onerror="this.src='https://placehold.co/340x420/e2d7c5/60281B?text=Foto+1'">
            <div class="photo-caption">Bocetos iniciales en el estudio (01)</div>
          </div>

          <div class="photo-container box-2">
            <img src="assets/foto-2.jpg" alt="Proceso de diseño 2" onerror="this.src='https://placehold.co/360x300/e2d7c5/60281B?text=Foto+2'">
            <div class="photo-caption">Pruebas de tejido y patronaje (02)</div>
          </div>

          <div class="photo-container box-3">
            <img src="assets/foto-3.jpg" alt="Proceso de diseño 3" onerror="this.src='https://placehold.co/380x440/e2d7c5/60281B?text=Foto+3'">
            <div class="photo-caption">Detalles de costura y acabados (03)</div>
          </div>

          <div class="photo-container box-4">
            <img src="assets/foto-4.jpg" alt="Proceso de diseño 4" onerror="this.src='https://placehold.co/350x380/e2d7c5/60281B?text=Foto+4'">
            <div class="photo-caption">Montaje final de colección (04)</div>
          </div>

        </div>
      </div>

    </section>
  </main>

  <div class="hojas" aria-hidden="true"></div>

  <script>
    const video = document.getElementById('logoVideo');
    
    video.addEventListener('ended', () => {
      video.pause();
      video.currentTime = video.duration;
    });
  </script>
</body>
</html>
