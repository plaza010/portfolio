<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bosquejo Fest</title>
  <meta name="description" content="Antes de existir, todo es bosquejo. Festival de moda que celebra el proceso de crear.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #899C75;
      --rojo: #D94726;
      --azul: #B2CFDE;
      --corteza: #60281B;
      --crema: #FFF9E5;
      --arena: #EBDFCC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      color: var(--corteza);
      background: var(--corteza);
    }

    /* Fondo fotográfico desenfocado fijo */
    .bg {
      position: fixed; inset: -4%;
      background: url('assets/bosquejo-bg.jpg') center/cover no-repeat;
      filter: blur(14px) saturate(.9);
      z-index: 0;
    }

    /* Menú superior fijo */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem;
      padding-top: calc(.5rem + env(safe-area-inset-top, 0px));
      background: var(--arena);
    }
    .nav img { height: 1.7rem; display: block; }
    .nav ul { list-style: none; display: flex; gap: .2rem; align-items: center; }
    .nav li + li::before { content: "/"; color: var(--corteza); opacity: .7; margin-right: .2rem; font-style: italic; }
    .nav a {
      font-style: italic; font-weight: 300; font-size: 1.3rem;
      color: var(--corteza); opacity: .38; text-decoration: none;
      padding: .2rem .5rem; transition: opacity .25s;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { opacity: 1; }
    .nav a:focus-visible { outline: 1px solid var(--rojo); outline-offset: 2px; }

    /* Sombra de hojas: GIF animado fijo en primer plano */
    .hojas {
      position: fixed; inset: 0; z-index: 30;
      pointer-events: none;
      background: url('assets/hojas.gif') center/cover no-repeat;
      mix-blend-mode: multiply;
      opacity: .6;
    }

    /* Tarjeta central fija en pantalla */
    main {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 5.5rem 9% 6%;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      background: var(--arena);
      border-radius: .6rem;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden;
      animation: entra 1.6s ease both;
    }

    /* Cabecera fija con el logo y lema (desvanece al hacer scroll) */
    .card-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(2rem, 9vh, 6rem);
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.35s ease-out;
    }

    .logo-container {
      position: relative;
      width: min(44vw, 560px);
      margin-top: -4vh;
      margin-left: -1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .logo-container img.logo-estatico {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.90;
    }

    .logo-container video.logo-animado {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.90;
    }

    .lema {
      font-style: italic; font-weight: 300;
      font-size: clamp(1.1rem, 1.5vw, 1.5rem);
      color: #1a1a1a;
      text-align: center; padding: 0 1.5rem;
    }
    @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Área con scroll interno dentro de la tarjeta crema */
    .card-scroll-area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 5;
      padding-bottom: 12rem;

      scrollbar-width: thin;
      scrollbar-color: #C5B59D transparent;
    }

    .card-scroll-area::-webkit-scrollbar {
      width: 8px;
    }

    .card-scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .card-scroll-area::-webkit-scrollbar-thumb {
      background: #C5B59D;
      border-radius: 10px;
