<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bosquejo Fest</title>
  <meta name="description" content="Antes de existir, todo es bosquejo. Festival de moda que celebra el proceso de crear.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #899C75;
      --rojo: #D94726;
      --azul: #B2CFDE;
      --corteza: #60281B;
      --crema: #FFF9E5;
      --arena: #EBDFCC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      color: var(--corteza);
      background: var(--corteza);
    }

    /* Fondo fotográfico desenfocado fijo */
    .bg {
      position: fixed; inset: -4%;
      background: url('assets/bosquejo-bg.jpg') center/cover no-repeat;
      filter: blur(14px) saturate(.9);
      z-index: 0;
    }

    /* Menú superior fijo */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem;
      padding-top: calc(.5rem + env(safe-area-inset-top, 0px));
      background: var(--arena);
    }
    .nav img { height: 1.7rem; display: block; }
    .nav ul { list-style: none; display: flex; gap: .2rem; align-items: center; }
    .nav li + li::before { content: "/"; color: var(--corteza); opacity: .7; margin-right: .2rem; font-style: italic; }
    .nav a {
      font-style: italic; font-weight: 300; font-size: 1.3rem;
      color: var(--corteza); opacity: .38; text-decoration: none;
      padding: .2rem .5rem; transition: opacity .25s;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { opacity: 1; }
    .nav a:focus-visible { outline: 1px solid var(--rojo); outline-offset: 2px; }

    /* Sombra de hojas: GIF animado fijo en primer plano */
    .hojas {
      position: fixed; inset: 0; z-index: 30;
      pointer-events: none;
      background: url('assets/hojas.gif') center/cover no-repeat;
      mix-blend-mode: multiply;
      opacity: .6;
    }

    /* Tarjeta central fija en pantalla */
    main {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 5.5rem 9% 6%;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      background: var(--arena);
      border-radius: .6rem;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden;
      animation: entra 1.6s ease both;
    }

    /* Cabecera fija con el vídeo (ligeramente a la izquierda, 90% opacidad) y lema en el centro */
    .card-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(2rem, 9vh, 6rem);
      pointer-events: none;
      z-index: 2;
    }
    
    .card .logo-animado {
      width: min(44vw, 560px);
      height: auto;
      display: block;
      margin-top: -4vh;
      margin-left: -1.2rem; /* Ligero ajuste a la izquierda para centrado óptico */
      opacity: 0.90; /* Quita un 10% de opacidad para que no distraiga tanto */
    }

    .lema {
      font-style: italic; font-weight: 300;
      font-size: clamp(1.1rem, 1.5vw, 1.5rem);
      color: #1a1a1a;
      text-align: center; padding: 0 1.5rem;
    }
    .lema b { font-weight: 400; font-style: italic; color: #000; }
    @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Área con scroll interno dentro de la tarjeta crema */
    .card-scroll-area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 5;
      padding-bottom: 12rem;

      /* Barra de desplazamiento elegante con color #EDE0CC y sin fondo blanco */
      scrollbar-width: thin;
      scrollbar-color: #EDE0CC transparent;
    }

    .card-scroll-area::-webkit-scrollbar {
      width: 8px;
    }

    .card-scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .card-scroll-area::-webkit-scrollbar-thumb {
      background: #EDE0CC;
      border-radius: 10px;
    }

    .card-scroll-area::-webkit-scrollbar-thumb:hover {
      background: #d8cbba;
    }

    /* Contenedor interno largo para permitir el desplazamiento */
    .scroll-inner-content {
      position: relative;
      width: 100%;
      height: 340vh;
      pointer-events: none;
    }

    /* Elementos de imagen con pie de foto en tipografía Roboto */
    .gallery-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: auto;
      width: 360px;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 0px; /* Sin bordes redondos, totalmente cuadradas */
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      display: block;
    }

    .gallery-caption {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--corteza);
      margin-top: 0.6rem;
      text-align: left;
      opacity: 0.85;
    }

    /* Posiciones de las imágenes (empezando más abajo y separadas hacia los lados) */
    .item-1 { top: 65vh; left: 4vw; }
    .item-2 { top: 135vh; right: 4vw; }
    .item-3 { top: 210vh; left: 5vw; }
    .item-4 { top: 285vh; right: 5vw; }

    @media (max-width: 760px) {
      .nav a { font-size: 1rem; padding: .2rem .25rem; }
      .nav li + li::before { margin-right: 0; }
      main { padding: 4.5rem 5% 7%; }
      .card .logo-animado { width: 72vw; margin-left: -0.6rem; }
      
      .gallery-item { width: 230px; }
      .item-1 { left: 3vw; top: 60vh; }
      .item-2 { right: 3vw; top: 125vh; }
      .item-3 { left: 3vw; top: 195vh; }
      .item-4 { right: 3vw; top: 265vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .hojas { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" role="presentation"></div>

  <header class="nav">
    <a href="./" aria-label="Bosquejo, inicio" style="opacity:1;padding:0"><img src="assets/bosquejo-b.png" alt="B"></a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="#tienda">Tienda</a></li>
        <li><a href="#festival" aria-current="page">El festival</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      
      <!-- Cabecera fija con el vídeo WebM integrado -->
      <div class="card-header">
        <h1 style="all:unset">
          <video class="logo-animado" id="logoVideo" muted playsinline autoplay preload="auto">
            <source src="assets/bosquejo-logo-escribiendo.webm" type="video/webm">
            Tu navegador no soporta video HTML5.
          </video>
        </h1>
        <p class="lema">"Antes de existir, todo es <b>bosquejo.</b>"</p>
      </div>

      <!-- Área con scroll interno dentro de la tarjeta -->
      <div class="card-scroll-area">
        <div class="scroll-inner-content">
          
          <div class="gallery-item item-1">
            <img src="assets/foto-1.jpg" alt="Proceso creativo 1">
            <div class="gallery-caption">Proceso creativo en taller, 2026.</div>
          </div>

          <div class="gallery-item item-2">
            <img src="assets/foto-2.jpg" alt="Proceso creativo 2">
            <div class="gallery-caption">Bocetos iniciales sobre tejido crudo.</div>
          </div>

          <div class="gallery-item item-3">
            <img src="assets/foto-3.jpg" alt="Proceso creativo 3">
            <div class="gallery-caption">Estudio de volúmenes y formas.</div>
          </div>

          <div class="gallery-item item-4">
            <img src="assets/foto-4.jpg" alt="Proceso creativo 4">
            <div class="gallery-caption">Materiales listos para la pasarela.</div>
          </div>

        </div>
      </div>

    </section>
  </main>

  <div class="hojas" aria-hidden="true"></div>

  <script>
    const video = document.getElementById('logoVideo');
    
    // Al terminar la animación, congela el vídeo exactamente en el último frame
    video.addEventListener('ended', () => {
      video.pause();
      video.currentTime = video.duration;
    });
  </script>
</body>
</html>
