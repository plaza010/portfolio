<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bosquejo Fest</title>
  <meta name="description" content="Antes de existir, todo es bosquejo. Festival de moda que celebra el proceso de crear.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,100;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #899C75;
      --rojo: #D94726;
      --azul: #B2CFDE;
      --corteza: #60281B;
      --crema: #FFF9E5;
      --arena: #EBDFCC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Habilitamos el scroll vertical de manera nativa */
    html, body {
      min-height: 350vh; /* Altura total de la página para permitir scroll amplio */
    }
    body {
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: 300;
      color: var(--corteza);
      background: var(--corteza);
      overflow-x: hidden;
    }

    /* Fondo fotográfico desenfocado fijo */
    .bg {
      position: fixed; inset: 0;
      background: url('assets/bosquejo-bg.jpg') center/cover no-repeat;
      filter: blur(14px) saturate(.9);
      z-index: 0;
    }

    /* Menú superior fijo */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem;
      padding-top: calc(.5rem + env(safe-area-inset-top, 0px));
      background: var(--arena);
    }
    .nav img { height: 1.7rem; display: block; }
    .nav ul { list-style: none; display: flex; gap: .2rem; align-items: center; }
    .nav li + li::before { content: "/"; color: var(--corteza); opacity: .7; margin-right: .2rem; font-style: italic; }
    .nav a {
      font-style: italic; font-weight: 300; font-size: 1.3rem;
      color: var(--corteza); opacity: .38; text-decoration: none;
      padding: .2rem .5rem; transition: opacity .25s;
    }
    .nav a:hover, .nav a:focus-visible, .nav a[aria-current="page"] { opacity: 1; }
    .nav a:focus-visible { outline: 1px solid var(--rojo); outline-offset: 2px; }

    /* Sombra de hojas: GIF animado fijo que nunca se mueve */
    .hojas {
      position: fixed; inset: 0; z-index: 30;
      pointer-events: none;
      background: url('assets/hojas.gif') center/cover no-repeat;
      mix-blend-mode: multiply;
      opacity: .6;
    }

    /* Tarjeta central fija en pantalla */
    main {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 5.5rem 9% 6%;
      pointer-events: none;
    }
    .card {
      position: relative; width: 100%; height: 100%;
      background: var(--arena);
      border-radius: .6rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(2rem, 9vh, 6rem);
      overflow: hidden;
      animation: entra 1.6s ease both;
      pointer-events: auto;
    }
    
    .card .logo-animado {
      width: min(44vw, 560px);
      height: auto;
      display: block;
      margin-top: -4vh;
    }

    .lema {
      font-style: italic; font-weight: 300;
      font-size: clamp(1.1rem, 1.5vw, 1.5rem);
      color: #1a1a1a;
      text-align: center; padding: 0 1.5rem;
    }
    .lema b { font-weight: 400; font-style: italic; color: #000; }
    @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Capa de contenido flotante (cuadrados negros de testeo y textos) que suben al hacer scroll */
    .scroll-content {
      position: absolute;
      top: 0; left: 0; width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }

    .test-item {
      position: absolute;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 400;
      border-radius: 8px;
      pointer-events: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Posiciones de los elementos de prueba a lo largo del scroll vertical */
    .box-1 { top: 110vh; left: 12vw; width: 180px; height: 220px; }
    .box-2 { top: 150vh; right: 12vw; width: 200px; height: 160px; }
    .box-3 { top: 210vh; left: 15vw; width: 220px; height: 260px; }
    .box-4 { top: 270vh; right: 15vw; width: 170px; height: 200px; }

    @media (max-width: 760px) {
      .nav a { font-size: 1rem; padding: .2rem .25rem; }
      .nav li + li::before { margin-right: 0; }
      main { padding: 4.5rem 5% 7%; }
      .card .logo-animado { width: 72vw; }
      .box-1 { left: 8vw; width: 120px; height: 150px; }
      .box-2 { right: 8vw; width: 130px; height: 120px; }
      .box-3 { left: 10vw; width: 140px; height: 180px; }
      .box-4 { right: 10vw; width: 120px; height: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .hojas { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" role="presentation"></div>

  <header class="nav">
    <a href="./" aria-label="Bosquejo, inicio" style="opacity:1;padding:0"><img src="assets/bosquejo-b.png" alt="B"></a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="#tienda">Tienda</a></li>
        <li><a href="#festival" aria-current="page">El festival</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Tarjeta central fija -->
  <main>
    <section class="card">
      <h1 style="all:unset">
        <!-- Usamos un elemento de video optimizado para control por scroll (de 10s de duración) -->
        <video class="logo-animado" id="logoVideo" muted playsinline preload="auto">
          <source src="assets/bosquejo-logo-escribiendo.webm" type="video/webm">
          <source src="assets/bosquejo-logo-escribiendo.mp4" type="video/mp4">
          Tu navegador no soporta video HTML5.
        </video>
      </h1>
      <p class="lema">"Antes de existir, todo es <b>bosquejo.</b>"</p>
    </section>
  </main>

  <!-- Contenido que sube al hacer scroll -->
  <div class="scroll-content">
    <div class="test-item box-1">Foto Test 1</div>
    <div class="test-item box-2">Foto Test 2</div>
    <div class="test-item box-3">Foto Test 3</div>
    <div class="test-item box-4">Foto Test 4</div>
  </div>

  <!-- Textura: sombra de hojas (GIF fijo) -->
  <div class="hojas" aria-hidden="true"></div>

  <script>
    const video = document.getElementById('logoVideo');
    
    // Pausar el vídeo inicialmente al cargar los metadatos
    video.addEventListener('loadedmetadata', function() {
      video.pause();
    });

    // Controlar el avance de los 10 segundos del vídeo en función de la posición del scroll
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll <= 0) return;
      const scrollFraction = scrollTop / maxScroll;

      if (video.duration) {
        video.currentTime = scrollFraction * video.duration;
      }
    });
  </script>
</body>
</html>
